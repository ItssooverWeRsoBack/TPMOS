name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - "01 Auth"
        - "02 Home"
        - "03 Teams Directory"
        - "04 Team Detail"
        - "05 Quarterly Planning"
        - "06 Epic Detail"
        - "07 Quarter Management"
        - "08 Leadership Goals (Phase 2)"
        - "09 Initiative Mapping (Phase 2)"
        - "10 Executive Visualizer (Phase 2)"
        - "11 TPM Intake"
        - "12 Reporting/Export (Phase 2)"
        - "13 Capacity"
        - "14 Risks Feed"
        - "15 Admin"
        - "Cross-cutting / infrastructure"
    validations:
      required: true
